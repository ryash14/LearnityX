<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ratio & Percentage Master</title>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet" />
<link rel="icon" type="image/x-icon" href="images/favicon.ico">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Ratio & Percentage Master</h1>
            <p>Master financial mathematics through practice!</p>
        </header>

        <div class="current-selection">
            <span id="selected-topic"><i class="fas fa-balance-scale"></i> Ratio Basics</span>
            <span id="selected-difficulty"><i class="fas fa-bolt"></i> Easy</span>
        </div>

        <div class="controls">
            <div class="form-group">
                <label>Topic:</label>
                <div class="topic-selector">
                    <div class="topic-option selected" data-value="ratio-basics">
                        <i class="fas fa-balance-scale"></i> Ratio Basics
                    </div>
                    <div class="topic-option" data-value="percentage-change">
                        <i class="fas fa-percent"></i> % Change
                    </div>
                    <div class="topic-option" data-value="profit-loss">
                        <i class="fas fa-chart-line"></i> Profit/Loss
                    </div>
                    <div class="topic-option" data-value="interest">
                        <i class="fas fa-piggy-bank"></i> Interest
                    </div>
                    <div class="topic-option" data-value="mixture">
                        <i class="fas fa-blender"></i> Mixtures
                    </div>
                    <div class="topic-option" data-value="averages">
                        <i class="fas fa-equals"></i> Averages
                    </div>
                    <div class="topic-option" data-value="partnership">
                        <i class="fas fa-handshake"></i> Partnership
                    </div>
                </div>
                <input type="hidden" id="topic" value="ratio-basics">
            </div>
            
            <div class="form-group">
                <label>Difficulty:</label>
                <div class="difficulty-selector">
                    <div class="difficulty-option selected" data-value="easy">
                        <i class="fas fa-smile"></i> Easy
                    </div>
                    <div class="difficulty-option" data-value="medium">
                        <i class="fas fa-meh"></i> Medium
                    </div>
                    <div class="difficulty-option" data-value="hard">
                        <i class="fas fa-frown"></i> Hard
                    </div>
                </div>
                <input type="hidden" id="difficulty" value="easy">
            </div>
            
            <button id="generate-btn" class="btn generate-btn">
                <i class="fas fa-magic"></i> Generate Question
            </button>
        </div>

        <div class="question-container hidden">
            <div class="question-box">
                <h2><i class="fas fa-question-circle"></i> Question:</h2>
                <div id="question-output" class="question-output"></div>
            </div>

            <div class="answer-section hidden">
                <h3><i class="fas fa-edit"></i> Your Answer:</h3>
                <button id="submit-answer" class="btn submit-btn">
                    <i class="fas fa-paper-plane"></i> Submit Answer
                </button>
            </div>

            <div id="feedback-container" class="feedback-container hidden">
                <div id="answer-feedback" class="answer-feedback"></div>
                <div id="explanation" class="explanation hidden">
                    <h4><i class="fas fa-lightbulb"></i> Explanation</h4>
                    <div class="explanation-content"></div>
                </div>
            </div>
        </div>

        <div id="error-container" class="error-container hidden">
            <i class="fas fa-exclamation-circle"></i> <span class="error-message"></span>
        </div>
    </div>

    <script src="script.js"></script>
    <script src="https://cdn.polyfill.io/v3/polyfill.min.js"></script>
    <script id="MathJax-script" async 
        src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js">
    </script>
</body>
</html>

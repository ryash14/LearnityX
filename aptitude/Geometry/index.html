<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Geometry Master</title>
  <link rel="icon" type="image/x-icon" href="images/favicon.ico">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="container">
    <header>
      <h1>Geometry Master</h1>
      <p>Master shapes, spaces, and measurements!</p>
    </header>

    <div class="current-selection">
      <span id="selected-topic"><i class="fas fa-shapes"></i> Topic: Triangles</span>
      <span id="selected-difficulty"><i class="fas fa-bolt"></i> Difficulty: Easy</span>
    </div>

    <div class="controls">
      <div class="form-group">
        <label>Topic:</label>
        <div class="topic-selector">
          <div class="topic-option selected" data-value="triangles"><i class="fas fa-shapes"></i> Triangles</div>
          <div class="topic-option" data-value="circles"><i class="fas fa-circle"></i> Circles</div>
          <div class="topic-option" data-value="polygons"><i class="fas fa-shapes"></i> Polygons</div>
          <div class="topic-option" data-value="coordinate"><i class="fas fa-map-marker-alt"></i> Coordinate Geometry</div>
          <div class="topic-option" data-value="areas"><i class="fas fa-square"></i> Areas</div>
          <div class="topic-option" data-value="volumes"><i class="fas fa-cube"></i> 3D Volumes</div>
          <div class="topic-option" data-value="similarity"><i class="fas fa-random"></i> Similarity</div>
        </div>
        <input type="hidden" id="topic" value="triangles" />
      </div>

      <div class="form-group">
        <label>Difficulty:</label>
        <div class="difficulty-selector">
          <div class="difficulty-option selected" data-value="easy"><i class="fas fa-smile"></i> Easy</div>
          <div class="difficulty-option" data-value="medium"><i class="fas fa-meh"></i> Medium</div>
          <div class="difficulty-option" data-value="hard"><i class="fas fa-frown"></i> Hard</div>
        </div>
        <input type="hidden" id="difficulty" value="easy" />
      </div>

      <button id="generate-btn" class="btn generate-btn">
        <i class="fas fa-magic"></i> Generate Question
      </button>
    </div>

    <div class="question-container hidden">
      <div class="question-box">
        <h2><i class="fas fa-question-circle"></i> Question:</h2>
        <div id="question-output" class="question-output"></div>
      </div>

      <div class="answer-section hidden">
        <div class="options-container"></div>
        <button id="submit-answer" class="btn submit-btn">
          <i class="fas fa-paper-plane"></i> Submit Answer
        </button>
      </div>

      <div id="feedback-container" class="feedback-container hidden">
        <div id="explanation" class="explanation hidden">
          <h4><i class="fas fa-lightbulb"></i> Explanation</h4>
          <div class="explanation-content"></div>
        </div>
      </div>
    </div>

    <div id="error-container" class="error-container hidden">
      <i class="fas fa-exclamation-circle"></i> <span class="error-message"></span>
    </div>
  </div>

  <script src="script.js"></script>
  <script src="https://polyfill.io/v3/polyfill.min.js?features=es6"></script>
  <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Probability Master</title>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet" />
<link rel="icon" type="image/x-icon" href="images/favicon.ico">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="container">
      <header>
        <h1>Probability Master</h1>
        <p>Master permutations, combinations, and probability concepts!</p>
      </header>

      <div class="current-selection">
        <span id="selected-topic"><i class="fas fa-random"></i> Topic: Permutations</span>
        <span id="selected-difficulty"><i class="fas fa-bolt"></i> Difficulty: Easy</span>
      </div>

      <div class="controls">
        <div class="form-group">
          <label>Topic:</label>
          <div class="topic-selector">
            <div class="topic-option selected" data-value="permutations">
              <i class="fas fa-random"></i> Permutations
            </div>
            <div class="topic-option" data-value="combinations">
              <i class="fas fa-cogs"></i> Combinations
            </div>
            <div class="topic-option" data-value="basic-probability">
              <i class="fas fa-percent"></i> Basic Probability
            </div>
            <div class="topic-option" data-value="conditional">
              <i class="fas fa-question-circle"></i> Conditional
            </div>
            <div class="topic-option" data-value="cards-dice">
              <i class="fas fa-dice"></i> Cards/Dice
            </div>
            <div class="topic-option" data-value="circular">
              <i class="fas fa-circle"></i> Circular
            </div>
            <div class="topic-option" data-value="bayes">
              <i class="fas fa-brain"></i> Bayes' Theorem
            </div>
          </div>
          <input type="hidden" id="topic" value="permutations" />
        </div>

        <div class="form-group">
          <label>Difficulty:</label>
          <div class="difficulty-selector">
            <div class="difficulty-option selected" data-value="easy">
              <i class="fas fa-smile"></i> Easy
            </div>
            <div class="difficulty-option" data-value="medium">
              <i class="fas fa-meh"></i> Medium
            </div>
            <div class="difficulty-option" data-value="hard">
              <i class="fas fa-frown"></i> Hard
            </div>
          </div>
          <input type="hidden" id="difficulty" value="easy" />
        </div>

        <button id="generate-btn" class="btn generate-btn">
          <i class="fas fa-magic"></i> Generate Question
        </button>
      </div>

      <div class="question-container hidden">
        <div class="question-box">
          <h2><i class="fas fa-question-circle"></i> Question:</h2>
          <div id="question-output" class="question-output"></div>
        </div>

        <div class="answer-section hidden">
          <div class="options-container"></div>
          <button id="submit-answer" class="btn submit-btn">
            <i class="fas fa-paper-plane"></i> Submit Answer
          </button>
        </div>

        <div id="feedback-container" class="feedback-container hidden">
          <div id="answer-feedback" class="answer-feedback"></div>
          <div id="explanation" class="explanation hidden">
            <h4><i class="fas fa-lightbulb"></i> Explanation</h4>
            <div class="explanation-content"></div>
          </div>
        </div>
      </div>

      <div id="error-container" class="error-container hidden">
        <i class="fas fa-exclamation-circle"></i>
        <span class="error-message"></span>
      </div>
    </div>

    <script src="script.js"></script>
    <script src="https://cdn.polyfill.io/v3/polyfill.min.js"></script>
    <script
      id="MathJax-script"
      async
      src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"
    ></script>
  </body>
</html>
